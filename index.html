    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(INITIAL_DATA));
          return JSON.parse(JSON.stringify(INITIAL_DATA));
        }
        return JSON.parse(raw);
      } catch (e) {
        return JSON.parse(JSON.stringify(INITIAL_DATA));
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      } catch (e) {
        console.error('Gagal menyimpan ke localStorage', e);
      }
      applyThemeColors();
    }

      document.documentElement.style.setProperty('--primary-border', hexToRgba(color, 0.3));
    }

    function adjustColor(hex, amount) {
      return '#' + hex.replace(/^#/, '').replace(/../g, color =>
        ('0' + Math.min(255, Math.max(0, parseInt(color, 16) + amount)).toString(16)).substr(-2)
      );
    }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function generateCaptcha() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let res = '';
      for (let i = 0; i < 5; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
      return res;
    }

    // Toast Notification
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const id = 'toast-' + Date.now();
      const colors = {
        success: 'bg-emerald-700 text-white border-emerald-500',
        error: 'bg-rose-600 text-white border-rose-400',
        info: 'bg-slate-800 text-white border-slate-600',
        warning: 'bg-amber-600 text-white border-amber-400'
      };
      const iconName = type === 'success' ? 'check-circle' : type === 'error' ? 'alert-circle' : 'info';
      const el = document.createElement('div');
      el.id = id;
      el.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl border ${colors[type] || colors.info} animate-fade text-sm font-medium`;
      el.innerHTML = `<i data-lucide="${iconName}" class="w-5 h-5 shrink-0"></i><span class="flex-1">${message}</span>`;
      container.appendChild(el);
      lucide.createIcons();
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.3s';
        setTimeout(() => el.remove(), 300);
      }, 3200);
    }

    // Export Word / PDF Helper
    function exportWordDoc(title, elementIdOrText) {
      const targetEl = document.getElementById(elementIdOrText);
      const bodyContent = targetEl ? targetEl.innerHTML : `<p>${elementIdOrText}</p>`;
      const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
      <head><meta charset='utf-8'><title>${title}</title>
      <style>
        body { font-family: Arial, sans-serif; font-size: 11pt; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        th, td { border: 1px solid #333; padding: 6px 8px; text-align: left; vertical-align: top; }
        th { background-color: #047857; color: white; }
      </style></head><body>
      <h2 style="text-align:center; margin-bottom:2px;">KEMENTERIAN AGAMA REPUBLIK INDONESIA</h2>
      <h3 style="text-align:center; margin-top:0;">KANTOR KEMENTERIAN AGAMA KABUPATEN POHUWATO</h3>
      <hr/>
      <h4>${title}</h4>
      ${bodyContent}
      </body></html>`;

      const blob = new Blob(['\ufeff', header], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${title.replace(/[^a-z0-9]/gi, '_')}.doc`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast(`Dokumen "${title}.doc" berhasil diunduh!`, 'success');
    }

      printWrapper.innerHTML = `
        <div style="text-align:center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 16px;">
          <h2 style="margin:0; font-size:16px; font-weight:bold;">KEMENTERIAN AGAMA KABUPATEN POHUWATO</h2>
          <p style="margin:2px 0 0; font-size:12px;">MALEO — Madrasah Digital Assistance Pohuwato</p>
        </div>
        ${el.innerHTML}
      `;
      document.body.appendChild(printWrapper);
      window.print();
      document.body.removeChild(printWrapper);
    }

      session.portalMode = mode;
      session.captchaCode = generateCaptcha();
      render();
    }
    function refreshCaptcha() {
      session.captchaCode = generateCaptcha();
      render();
    }
    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('login-username').value.trim();
      const pass = document.getElementById('login-password').value.trim();
      if (session.portalTab === 'pengawas') {
        const found = db.pengawasUsers.find(u => u.username === user && u.password === pass);
        if (!found) return showToast('Username atau Password Pengawas tidak sesuai!', 'error');
        session.role = 'pengawas';
        session.userId = found.id;
        session.activeMenu = 'beranda';
        session.activeSubMenu = 'madrasah_binaan';
        showToast(`Selamat datang, ${found.nama}`, 'success');
        render();
      } else {
        const found = db.kepalaUsers.find(u => u.username === user && u.password === pass);
        if (!found) return showToast('Username atau Password Kepala Madrasah tidak sesuai!', 'error');
        session.role = 'kepala';
        session.userId = found.id;
        session.selectedMadrasahId = found.madrasahId;
        session.activeMenu = 'beranda';
        session.activeSubMenu = 'profil_madrasah';
        showToast(`Selamat datang Kepala Madrasah Hebat, ${found.nama}`, 'success');
        render();
      }
    }
    function quickDemoLogin(role) {
      if (role === 'pengawas') {
        const pgw = db.pengawasUsers[0];
        session.role = 'pengawas';
        session.userId = pgw.id;
        session.activeMenu = 'beranda';
        session.activeSubMenu = 'madrasah_binaan';
        showToast(`Login Demo Pengawas: ${pgw.nama}`, 'success');
      } else {
        const km = db.kepalaUsers[0];
        session.role = 'kepala';
        session.userId = km.id;
        session.selectedMadrasahId = km.madrasahId;
        session.activeMenu = 'beranda';
        session.activeSubMenu = 'profil_madrasah';
        showToast(`Login Demo Kepala Madrasah: ${km.nama}`, 'success');
      }
      render();
    }
    function handleRegisterPengawas(e) {
      e.preventDefault();
      const captcha = document.getElementById('reg-pgw-captcha').value.trim().toUpperCase();
      if (captcha !== session.captchaCode) {
        session.captchaCode = generateCaptcha();
        render();
        return showToast('Kode Captcha salah! Silakan coba lagi.', 'error');
      }
      const username = document.getElementById('reg-pgw-user').value.trim();
      if (db.pengawasUsers.some(u => u.username === username)) {
        return showToast('Username sudah digunakan!', 'error');
      }
      db.pengawasUsers.push({
        id: 'pgw-' + Date.now(),
        nama: document.getElementById('reg-pgw-nama').value.trim(),
        nip: document.getElementById('reg-pgw-nip').value.trim(),
        username,
        password: document.getElementById('reg-pgw-pass').value.trim(),
        alamat: 'Kabupaten Pohuwato',
        email: `${username}@kemenag.go.id`,
        kontak: '-',
        foto: ''
      });
      saveState();
      session.portalMode = 'login';
      session.portalTab = 'pengawas';
      showToast('Akun Pengawas berhasil didaftarkan! Silakan masuk.', 'success');
      render();
    }
    function handleRegisterKepala(e) {
      e.preventDefault();
      const captcha = document.getElementById('reg-km-captcha').value.trim().toUpperCase();
      if (captcha !== session.captchaCode) {
        session.captchaCode = generateCaptcha();
        render();
        return showToast('Kode Captcha salah! Silakan coba lagi.', 'error');
      }
      const username = document.getElementById('reg-km-user').value.trim();
      if (db.kepalaUsers.some(u => u.username === username)) {
        return showToast('Username sudah digunakan!', 'error');
      }
      const madId = document.getElementById('reg-km-madrasah').value;
      const mad = db.madrasahList.find(m => m.id === madId);
      db.kepalaUsers.push({
        id: 'km-' + Date.now(),
        nama: document.getElementById('reg-km-nama').value.trim(),
        nip: document.getElementById('reg-km-nip').value.trim(),
        madrasahId: madId,
        namaMadrasah: mad ? mad.nama : 'Madrasah Binaan',
        tmt: document.getElementById('reg-km-tmt').value,
        username,
        password: document.getElementById('reg-km-pass').value.trim(),
        foto: ''
      });
      saveState();
      session.portalMode = 'login';
      session.portalTab = 'kepala';
      showToast('Akun Kepala Madrasah berhasil didaftarkan & terhubung ke Pengawas!', 'success');
      render();
    }
    function handleForgotPassword(e) {
      e.preventDefault();
      const role = document.getElementById('forgot-role').value;
      const user = document.getElementById('forgot-user').value.trim();
      const newPass = document.getElementById('forgot-newpass').value.trim();
      const list = role === 'pengawas' ? db.pengawasUsers : db.kepalaUsers;
      const found = list.find(u => u.username === user);
      if (!found) return showToast('Username tidak ditemukan dalam sistem!', 'error');
      found.password = newPass;
      saveState();
      session.portalMode = 'login';
      showToast('Kata sandi berhasil diperbarui! Silakan login.', 'success');
      render();
    }

      session.role = null;

    function simulateFileUpload(e, key) {
      const file = e.target.files[0];
      if (file) {

        showToast(`Berkas "${file.name}" siap disimpan!`, 'success');
        render();
      }

    function removeTempFile(key) {

    function handleSaveProfilMadrasah(e) {
      e.preventDefault();
      const madId = document.getElementById('prof-madrasah').value;
      const tahun = document.getElementById('prof-tahun').value;
      const jenjang = session.tempJenjang || 'MTs';
      let detail = {};
      if (jenjang === 'RA') {
        detail = {
          L: Number(document.getElementById('siswa-ra-l')?.value || 0),
          P: Number(document.getElementById('siswa-ra-p')?.value || 0)
        };
      } else {
        const grades = jenjang === 'MI' ? [1, 2, 3, 4, 5, 6] : jenjang === 'MTs' ? [7, 8, 9] : [10, 11, 12];
        grades.forEach(g => {
          detail[`k${g}L`] = Number(document.getElementById(`siswa-k${g}-l`)?.value || 0);
          detail[`k${g}P`] = Number(document.getElementById(`siswa-k${g}-p`)?.value || 0);
        });
      }

      const sarprasStatus = document.querySelector('input[name="prof-sarpras-status"]:checked')?.value || 'Memadai';
      const f = session.tempUploadedFiles;

      const record = {
        id: 'prof-' + Date.now(),
        madrasahId: madId,
        tahun,
        edm: {
          tahun: document.getElementById('prof-edm-tahun').value,
          nilai: document.getElementById('prof-edm-nilai').value,
          kategori: document.getElementById('prof-edm-kategori').value,
          fileName: f.edmPdf || `Hasil_EDM_${tahun}.pdf`
        },
        rapor: {
          tahun: document.getElementById('prof-rapor-tahun').value,
          literasi: document.getElementById('prof-rapor-lit').value,
          numerasi: document.getElementById('prof-rapor-num').value,
          posterName: f.raporPoster || `Poster_Rapor_${tahun}.pdf`,
          raporName: f.raporFile || `Rapor_Pendidikan_${tahun}.pdf`
        },
        gtk: {
          tersertifikasi: Number(document.getElementById('prof-gtk-sert').value || 0),
          belumTersertifikasi: Number(document.getElementById('prof-gtk-nonsert').value || 0),
          tendik: Number(document.getElementById('prof-gtk-tendik').value || 0)
        },
        siswa: { jenjang, detail },
        kesehatan: {
          skor: document.getElementById('prof-kesehatan-skor').value,
          fileName: f.kesehatanPdf || `Instrumen_Kesehatan_${tahun}.pdf`
        },
        sarpras: {
          status: sarprasStatus,
          fileName: f.sarprasPdf || `Instrumen_Sarpras_${tahun}.pdf`
        }
      };

      // Replace if same madrasah & year exists
      const existingIdx = db.profilMadrasah.findIndex(p => p.madrasahId === madId && p.tahun === tahun);
      if (existingIdx >= 0) db.profilMadrasah[existingIdx] = record;
      else db.profilMadrasah.push(record);

      session.selectedMadrasahId = madId;
      session.selectedYear = tahun;
      session.tempUploadedFiles = {};
      saveState();
      showToast('Profil Madrasah Binaan berhasil disimpan & tersinkronisasi!', 'success');
      if (session.role === 'pengawas') {
        navPengawas('beranda', 'profil_madrasah', 'lihat_profil');
      } else {
        render();
      }
    }

      const prof = db.profilMadrasah.find(p => p.id === profId);

      openModal('Edit Nilai Layanan Kesehatan Madrasah', `
        <form onsubmit="saveEditKesehatan(event, '${profId}')" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Nilai / Skor Layanan Kesehatan</label>
            <input type="text" id="edit-kes-val" value="${prof.kesehatan.skor}" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-bold" />

          <button type="submit" class="w-full py-2.5 bg-theme text-white font-bold rounded-xl text-sm">Simpan Perubahan</button>
        </form>
      `, 'max-w-md');
    }

      e.preventDefault();
      const prof = db.profilMadrasah.find(p => p.id === profId);

        saveState();
        closeModal();
        showToast('Nilai Layanan Kesehatan diperbarui!', 'success');
        render();

      const u = db.kepalaUsers.find(x => x.id === id);

      showToast(`Password akun ${u.nama} berhasil direset menjadi "123456"`, 'success');
      render();

    function savePortalSettings(e) {
      e.preventDefault();
      db.portalSettings.title = document.getElementById('set-title').value;
      db.portalSettings.subtitle = document.getElementById('set-subtitle').value;
      db.portalSettings.description = document.getElementById('set-desc').value;
      const color = document.querySelector('input[name="set-color"]:checked')?.value;
      if (color) db.portalSettings.themeColor = color;
      saveState();
      showToast('Pengaturan Portal & Warna Tema berhasil diperbarui!', 'success');
      render();
    }

    function handleLogoUpload(e, key) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        db.portalSettings[key] = ev.target.result;
        saveState();
        showToast('Logo berhasil diubah!', 'success');
        render();
      };
      reader.readAsDataURL(file);
    }

    function handlePengawasPhoto(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const u = db.pengawasUsers.find(x => x.id === session.userId);
        if (u) u.foto = ev.target.result;
        saveState();
        render();
      };
      reader.readAsDataURL(file);
    }

    function savePengawasProfile(e) {
      e.preventDefault();
      const u = db.pengawasUsers.find(x => x.id === session.userId);
      if (!u) return;
      u.nama = document.getElementById('pgw-edit-nama').value;
      u.nip = document.getElementById('pgw-edit-nip').value;
      u.username = document.getElementById('pgw-edit-user').value;
      u.password = document.getElementById('pgw-edit-pass').value;
      u.email = document.getElementById('pgw-edit-email').value;
      u.kontak = document.getElementById('pgw-edit-kontak').value;
      u.alamat = document.getElementById('pgw-edit-alamat').value;
      saveState();
      showToast('Profil Akun Pengawas berhasil diperbarui!', 'success');
      render();
    }

        { id: 'rekap_pendampingan', label: '4. Rekap Pendampingan', icon: 'layers' }

      return `
        <div class="space-y-6 animate-fade">

              <button onclick="navPengawas('pendampingan', '${t.id}', '')"

                </div>

                <button type="submit" class="px-6 py-3 bg-theme hover:bg-theme-dark text-white font-bold rounded-xl shadow text-sm flex items-center gap-2">
                  <i data-lucide="save" class="w-4 h-4"></i> Simpan Rencana Pendampingan Satuan Pendidikan
                </button>
              </form>
            </div>
          ` : mode === 'lihat_rencana' ? renderLihatRencanaDetail(currentUser) : renderKomentarDanPermohonan()}
        </div>
      `;
    }

    function toggleCheck(arrName, val, oppositePrefix) {
      session[arrName] = session[arrName].filter(x => !x.startsWith(oppositePrefix));
      if (session[arrName].includes(val)) {
        session[arrName] = session[arrName].filter(x => x !== val);
      } else {
        session[arrName].push(val);
      }
      render();
    }

    function toggleKapasitas(val, groupPrefix) {
      session.tempKapasitas = session.tempKapasitas.filter(x => x.startsWith(groupPrefix));
      if (session.tempKapasitas.includes(val)) {
        session.tempKapasitas = session.tempKapasitas.filter(x => x !== val);
      } else {
        session.tempKapasitas.push(val);
      }
      render();
    }

    function toggleCustomMetode(val) {
      const el = document.getElementById('plan-metode-custom');
      if (el) el.classList.toggle('hidden', val !== 'Lainnya');
    }

    function addRencanaRow() {
      session.tempRencanaItems.push({ deskripsi: '', target: '' });
      render();
    }
    function removeRencanaRow(idx) {
      session.tempRencanaItems.splice(idx, 1);
      render();
    }

    function saveRencanaPendampingan(e, komitmen, kapasitas, strategi) {
      e.preventDefault();
      const madId = session.selectedMadrasahId || db.madrasahList[0]?.id;
      const prioritas = document.getElementById('plan-prioritas').value;
      const selMetode = document.getElementById('plan-metode-select').value;
      const metode = selMetode === 'Lainnya' ? (document.getElementById('plan-metode-custom').value.trim() || 'Metode Khusus') : selMetode;

      const planObj = {
        id: 'plan-' + Date.now(),
        madrasahId: madId,
        komitmenChecks: [...session.tempKomitmen],
        komitmenKesimpulan: komitmen,
        kapasitasChecks: [...session.tempKapasitas],
        kapasitasKesimpulan: kapasitas,
        strategi,
        prioritas,
        metode,
        items: session.tempRencanaItems.map(i => ({ ...i })),
        komentarKepala: []
      };

      const idx = db.perencanaanPendampingan.findIndex(p => p.madrasahId === madId);
      if (idx >= 0) {
        planObj.komentarKepala = db.perencanaanPendampingan[idx].komentarKepala || [];
        db.perencanaanPendampingan[idx] = planObj;
      } else {
        db.perencanaanPendampingan.push(planObj);
      }

      session.tempRencanaItems = [{ deskripsi: '', target: '' }];
      saveState();
      showToast('Rencana Pendampingan Satuan Pendidikan berhasil disimpan!', 'success');
      navPengawas('pendampingan', 'perencanaan_pendampingan', 'lihat_rencana');
    }

    function ensureProgramRecord(madId) {
      let prog = db.perencanaanProgram.find(p => p.madrasahId === madId);
      if (!prog) {
        prog = {
          id: 'prog-' + Date.now(),
          madrasahId: madId,
          tanggal: new Date().toISOString().slice(0, 10),
          raporDriveLink: '',
          akarMasalah: [],
          potensi: [],
          harapan: [],
          ideProgram: []
        };
        db.perencanaanProgram.push(prog);
      }
      return prog;
    }

    function updateProgramMeta(madId, key, val) {
      const prog = ensureProgramRecord(madId);
      prog[key] = val;
      saveState();
      showToast('Data perencanaan program diperbarui.', 'success');
      render();
    }

    function addProgramPoint(e, madId) {
      e.preventDefault();
      const cat = document.getElementById('prog-cat').value;
      const text = document.getElementById('prog-text').value.trim();
      const prog = ensureProgramRecord(madId);
      prog[cat].push(text);
      saveState();
      showToast('Poin berhasil ditambahkan ke tabel!', 'success');
      render();
    }

    function deleteProgramPoint(madId, cat, idx) {
      const prog = db.perencanaanProgram.find(p => p.madrasahId === madId);
      if (prog) {
        prog[cat].splice(idx, 1);
        saveState();
        render();
      }
    }

    function editProgramPoint(madId, cat, idx) {
      const prog = db.perencanaanProgram.find(p => p.madrasahId === madId);
      if (!prog) return;
      openModal('Edit Poin Perencanaan Program', `
        <form onsubmit="saveEditedProgramPoint(event, '${madId}', '${cat}', ${idx})" class="space-y-4">
          <textarea id="edit-prog-point-val" rows="3" required class="w-full p-3 border border-slate-300 rounded-xl text-sm">${prog[cat][idx]}</textarea>
          <button type="submit" class="w-full py-2.5 bg-theme text-white font-bold rounded-xl text-sm">Simpan Perubahan</button>
        </form>
      `, 'max-w-md');
    }

    function saveEditedProgramPoint(e, madId, cat, idx) {
      e.preventDefault();
      const prog = db.perencanaanProgram.find(p => p.madrasahId === madId);

        render();

    function saveNewMeeting(e, madId) {
      e.preventDefault();
      let rec = db.pelaksanaanProgram.find(p => p.madrasahId === madId);
      if (!rec) {
        rec = { id: 'pel-' + Date.now(), madrasahId: madId, pertemuan: [], komentarKepala: [] };
        db.pelaksanaanProgram.push(rec);
      }
      rec.pertemuan.push({
        id: 'meet-' + Date.now(),
        ke: Number(document.getElementById('meet-ke').value),
        tanggal: document.getElementById('meet-tgl').value,
        praktikBaik: document.getElementById('meet-pb').value,
        hambatan: document.getElementById('meet-hb').value,
        strategi: document.getElementById('meet-st').value,
        tindakLanjut: document.getElementById('meet-tl').value
      });
      saveState();
      closeModal();
      showToast('Catatan pertemuan diskusi berkala ditambahkan!', 'success');
      render();
    }

    function openEditMeetingModal(madId, meetId) {
      const rec = db.pelaksanaanProgram.find(p => p.madrasahId === madId);
      const m = rec?.pertemuan.find(x => x.id === meetId);
      if (!m) return;
      openModal(`Edit Pertemuan ke-${m.ke}`, `
        <form onsubmit="saveEditedMeeting(event, '${madId}', '${meetId}')" class="space-y-3 text-xs">
          <div>

      `);

    function saveEditedMeeting(e, madId, meetId) {
      e.preventDefault();
      const rec = db.pelaksanaanProgram.find(p => p.madrasahId === madId);
      const m = rec?.pertemuan.find(x => x.id === meetId);
      if (m) {
        m.praktikBaik = document.getElementById('emeet-pb').value;
        m.hambatan = document.getElementById('emeet-hb').value;
        m.strategi = document.getElementById('emeet-st').value;
        m.tindakLanjut = document.getElementById('emeet-tl').value;
        saveState();
        closeModal();
        showToast('Catatan pertemuan diperbarui!', 'success');
        render();
      }
    }

    function deleteMeeting(madId, meetId) {
      const rec = db.pelaksanaanProgram.find(p => p.madrasahId === madId);
      if (rec) {
        rec.pertemuan = rec.pertemuan.filter(x => x.id !== meetId);
        saveState();
        render();
      }
    }

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-5">

          </div>

          <div class="space-y-4">
            ${list.length ? list.map(item => {
              const isExpired = new Date(item.batasPengisian) < new Date();
              return `
                <div class="p-5 rounded-2xl border ${item.mintaPerpanjangan ? 'border-amber-400 bg-amber-50/40' : 'border-slate-200 bg-slate-50/50'} space-y-3">
                  <div class="flex flex-wrap items-start justify-between gap-3">
                    <div>
                      <div class="flex items-center gap-2 flex-wrap">
                        <h4 class="font-extrabold text-slate-900 text-sm">${item.namaInstrumen}</h4>
                        <span class="px-2 py-0.5 rounded-md text-[11px] font-bold ${isExpired ? 'bg-rose-100 text-rose-800' : 'bg-emerald-100 text-emerald-800'}">
                          ${isExpired ? 'Terkunci (Lewat Batas)' : 'Aktif'}
                        </span>
                        ${item.mintaPerpanjangan ? `<span class="px-2 py-0.5 rounded-md text-[11px] font-bold bg-amber-200 text-amber-950 animate-pulse">Permohonan Perpanjangan Waktu!</span>` : ''}
                      </div>
                      <p class="text-xs text-slate-500 mt-1">
                        Tanggal: ${item.tanggal} • Batas: <strong>${item.batasPengisian.replace('T', ' ')}</strong> • Partisipan: <strong>${item.jumlahPartisipan} Orang</strong> • Status Kepala: <strong>${item.ditindaklanjuti ? 'Sudah Ditindaklanjuti' : 'Belum Ditindaklanjuti'}</strong>
                      </p>
                    </div>

                    <!-- Reward 5 Bintang -->
                    <div class="flex items-center gap-1 bg-white px-3 py-1.5 rounded-xl border border-slate-200">
                      <span class="text-[11px] font-bold text-slate-500 mr-1">Reward:</span>
                      ${[1, 2, 3, 4, 5].map(star => `
                        <button onclick="setInstrumenRating('${item.id}', ${star})" class="text-amber-400 hover:scale-125 transition">
                          <i data-lucide="star" class="w-4 h-4 ${star <= item.rating ? 'fill-amber-400' : 'text-slate-300'}"></i>
                        </button>
                      `).join('')}
                    </div>
                  </div>

                  <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center pt-2 border-t border-slate-200 text-xs">
                    <div class="md:col-span-4">
                      <label class="block font-bold text-slate-600 mb-1">Status Validasi Pengawas</label>
                      <select onchange="setInstrumenValidasi('${item.id}', this.value)" class="w-full px-3 py-1.5 rounded-xl border border-slate-300 bg-white font-bold">
                        <option value="Hasil Diterima" ${item.statusValidasi === 'Hasil Diterima' ? 'selected' : ''}>Hasil Diterima</option>
                        <option value="Proses Peninjauan" ${item.statusValidasi === 'Proses Peninjauan' ? 'selected' : ''}>Proses Peninjauan</option>
                        <option value="Selesai" ${item.statusValidasi === 'Selesai' ? 'selected' : ''}>Selesai</option>
                      </select>
                    </div>
                    <div class="md:col-span-5">
                      <label class="block font-bold text-slate-600 mb-1">Link Hasil Pengisian Instrumen</label>
                      <input type="text" value="${item.linkHasil || ''}" placeholder="Input link hasil rekap..." onchange="setInstrumenLinkHasil('${item.id}', this.value)" class="w-full px-3 py-1.5 rounded-xl border border-slate-300 bg-white" />
                    </div>
                    <div class="md:col-span-3 flex flex-wrap items-end justify-end gap-1.5 pt-4">
                      <button onclick="extendInstrumenDeadline('${item.id}')" class="px-2.5 py-1.5 bg-amber-600 text-white rounded-xl font-bold hover:bg-amber-700" title="Perpanjang Waktu">+ Waktu</button>
                      <button onclick="deleteInstrumen('${item.id}')" class="px-2.5 py-1.5 bg-rose-50 text-rose-700 border border-rose-200 rounded-xl font-bold">Hapus</button>
                    </div>
                  </div>
                </div>
              `;
            }).join('') : `<p class="text-center text-slate-400 text-xs py-6">Belum ada instrumen pemantauan untuk madrasah ini.</p>`}
          </div>
        </div>
      `;
    }

    function setInstrumenRating(id, stars) {
      const it = db.pemantauanList.find(x => x.id === id);
      if (it) { it.rating = stars; saveState(); showToast(`Reward ${stars} bintang diberikan!`, 'success'); render(); }
    }
    function setInstrumenValidasi(id, status) {
      const it = db.pemantauanList.find(x => x.id === id);
      if (it) { it.statusValidasi = status; saveState(); showToast(`Status validasi diubah menjadi "${status}"`, 'success'); render(); }
    }
    function setInstrumenLinkHasil(id, url) {
      const it = db.pemantauanList.find(x => x.id === id);
      if (it) { it.linkHasil = url; saveState(); showToast('Link hasil instrumen disimpan!', 'success'); }
    }
    function extendInstrumenDeadline(id) {
      const it = db.pemantauanList.find(x => x.id === id);
      if (!it) return;
      const future = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().slice(0, 16);
      it.batasPengisian = future;
      it.mintaPerpanjangan = false;
      saveState();
      showToast('Batas waktu pengisian diperpanjang 7 hari ke depan!', 'success');
      render();
    }
    function deleteInstrumen(id) {
      db.pemantauanList = db.pemantauanList.filter(x => x.id !== id);
      saveState();
      render();
    }

    function handleAddReferensi(e) {
      e.preventDefault();
      db.referensiList.unshift({
        id: 'ref-' + Date.now(),
        judul: document.getElementById('ref-judul').value,
        kategori: document.getElementById('ref-kat').value,
        linkDrive: document.getElementById('ref-link').value,
        tindakLanjut: false,
        tanggal: new Date().toISOString().slice(0, 10)
      });
      saveState();
      showToast('Referensi berhasil ditambahkan!', 'success');
      render();
    }
    function toggleRefTindakLanjut(id) {
      const r = db.referensiList.find(x => x.id === id);
      if (r) { r.tindakLanjut = !r.tindakLanjut; saveState(); render(); }
    }
    function deleteReferensi(id) {
      db.referensiList = db.referensiList.filter(x => x.id !== id);
      saveState();
      render();
    }

    // -------------------------------------------------------------------------
    // MENU 5 PENGAWAS: JADWAL KEGIATAN PENGAWAS
    // -------------------------------------------------------------------------
    function renderPengawasJadwal() {
      const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      const filtered = db.jadwalKegiatan.filter(j => {
        if (session.jadwalFilterTahun !== 'Semua' && j.tahun !== session.jadwalFilterTahun) return false;
        if (session.jadwalFilterBulan !== 'Semua' && j.bulan !== session.jadwalFilterBulan) return false;
        if (session.jadwalFilterMadrasah !== 'Semua' && j.madrasahId !== session.jadwalFilterMadrasah) return false;
        return true;
      });

      return `
        <div class="space-y-6 animate-fade">
          <!-- Input Jadwal Form -->
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h3 class="font-extrabold text-slate-800 text-lg mb-4">Input Jadwal Kegiatan Pengawas Madrasah</h3>
            <form onsubmit="handleSaveJadwal(event, false)" class="grid grid-cols-1 md:grid-cols-12 gap-3 text-xs items-end">
              <div class="md:col-span-2">
                <label class="block font-bold text-slate-700 mb-1">Tahun</label>
                <select id="jdw-tahun" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 bg-white font-bold">

                </select>
              </div>
              <div class="md:col-span-3">
                <label class="block font-bold text-slate-700 mb-1">Madrasah Sasaran</label>
                <select id="jdw-madrasah" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 bg-white font-bold">
                  <option value="ALL">Semua Madrasah Binaan</option>
                  ${db.madrasahList.map(m => `<option value="${m.id}">${m.nama}</option>`).join('')}
                </select>
              </div>
              <div class="md:col-span-2">
                <label class="block font-bold text-slate-700 mb-1">Bulan</label>
                <select id="jdw-bulan" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 bg-white font-bold">
                  ${months.map(m => `<option value="${m}">${m}</option>`).join('')}
                </select>
              </div>
              <div class="md:col-span-5">
                <label class="block font-bold text-slate-700 mb-1">Nama Kegiatan Kepengawasan *</label>
                <input type="text" id="jdw-kegiatan" required placeholder="Contoh: Pendampingan Penyusunan Kurikulum Madrasah" class="w-full px-3 py-2.5 rounded-xl border border-slate-300" />
              </div>
              <div class="md:col-span-12 flex justify-end gap-2 pt-2">
                <button type="submit" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl flex items-center gap-1.5">
                  <i data-lucide="save" class="w-4 h-4"></i> Simpan ke Rekapan
                </button>
                <button type="button" onclick="handleSaveAndSendJadwal()" class="px-4 py-2.5 bg-theme hover:bg-theme-dark text-white font-bold rounded-xl flex items-center gap-1.5 shadow">
                  <i data-lucide="send" class="w-4 h-4"></i> Simpan & Kirim ke Kepala Madrasah
                </button>
              </div>
            </form>
          </div>

          <!-- Hasil Rekapan Jadwal -->
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <h3 class="font-extrabold text-slate-800">Hasil Rekapan Jadwal Kegiatan Pengawas</h3>
              <div class="flex flex-wrap gap-2 text-xs">
                <select onchange="session.jadwalFilterTahun=this.value; render();" class="px-3 py-1.5 rounded-xl border border-slate-300 bg-white font-bold">
                  <option value="Semua">Semua Tahun</option>
                  ${['2027', '2028', '2029', '2030'].map(y => `<option value="${y}" ${session.jadwalFilterTahun === y ? 'selected' : ''}>${y}</option>`).join('')}
                </select>
                <select onchange="session.jadwalFilterBulan=this.value; render();" class="px-3 py-1.5 rounded-xl border border-slate-300 bg-white font-bold">
                  <option value="Semua">Semua Bulan</option>
                  ${months.map(m => `<option value="${m}" ${session.jadwalFilterBulan === m ? 'selected' : ''}>${m}</option>`).join('')}
                </select>
                <select onchange="session.jadwalFilterMadrasah=this.value; render();" class="px-3 py-1.5 rounded-xl border border-slate-300 bg-white font-bold">
                  <option value="Semua">Semua Madrasah</option>
                  ${db.madrasahList.map(m => `<option value="${m.id}" ${session.jadwalFilterMadrasah === m.id ? 'selected' : ''}>${m.nama}</option>`).join('')}
                </select>
              </div>
            </div>

            <div class="overflow-x-auto border border-slate-200 rounded-xl">

                    <th class="p-3">Bulan</th>
                    <th class="p-3">Madrasah</th>
                    <th class="p-3">Kegiatan</th>
                    <th class="p-3">Mode Pelaksanaan</th>
                    <th class="p-3">Keterangan</th>

                    return `

                        <td class="p-3 font-bold">${j.tahun}</td>
                        <td class="p-3">${j.bulan}</td>

                        </td>
                        <td class="p-3 space-x-3 whitespace-nowrap">
                          <label class="inline-flex items-center gap-1 cursor-pointer">
                            <input type="checkbox" ${j.tatapMuka ? 'checked' : ''} onchange="toggleJadwalMode('${j.id}', 'tatapMuka')" class="accent-emerald-700" />
                            <span>Tatap Muka</span>
                          </label>
                          <label class="inline-flex items-center gap-1 cursor-pointer">
                            <input type="checkbox" ${j.daring ? 'checked' : ''} onchange="toggleJadwalMode('${j.id}', 'daring')" class="accent-emerald-700" />
                            <span>Daring</span>
                          </label>
                        </td>
                        <td class="p-3">
                          <span class="px-2.5 py-1 rounded-lg font-extrabold text-[11px] ${terlaksana ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-500'}">

                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function handleSaveJadwal(e, autoSend = false) {
      if (e) e.preventDefault();
      const tahun = document.getElementById('jdw-tahun').value;
      const madVal = document.getElementById('jdw-madrasah').value;
      const bulan = document.getElementById('jdw-bulan').value;
      const kegiatan = document.getElementById('jdw-kegiatan').value.trim();
      if (!kegiatan) return showToast('Nama kegiatan wajib diisi!', 'error');

      const targets = madVal === 'ALL' ? db.madrasahList.map(m => m.id) : [madVal];
      targets.forEach(mId => {
        db.jadwalKegiatan.push({
          id: 'jdw-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
          tahun,
          bulan,
          madrasahId: mId,
          kegiatan,
          tatapMuka: false,
          daring: false,
          terkirim: autoSend
        });
      });

      saveState();
      showToast(autoSend ? 'Jadwal disimpan & berhasil dikirim ke akun Kepala Madrasah terkait!' : 'Jadwal disimpan ke rekapan!', 'success');
      render();
    }

    function handleSaveAndSendJadwal() {
      handleSaveJadwal(null, true);
    }
    function sendSingleJadwal(id) {
      const j = db.jadwalKegiatan.find(x => x.id === id);
      if (j) { j.terkirim = true; saveState(); showToast('Jadwal dikirim ke Kepala Madrasah!', 'success'); render(); }
    }
    function toggleJadwalMode(id, modeKey) {
      const j = db.jadwalKegiatan.find(x => x.id === id);
      if (j) { j[modeKey] = !j[modeKey]; saveState(); render(); }
    }
    function deleteJadwal(id) {
      db.jadwalKegiatan = db.jadwalKegiatan.filter(x => x.id !== id);
      saveState();
      render();
    }

          <!-- Ruang Chat Tindak Lanjut -->

            ${activeAduan ? `
              <div class="p-4 border-b border-slate-200 bg-slate-50 rounded-t-2xl">
                <div class="flex justify-between items-center">
                  <h4 class="font-extrabold text-slate-900 text-sm">${activeAduan.namaMadrasah} — ${activeAduan.kepalaMadrasah}</h4>
                  <span class="text-xs text-slate-500">${activeAduan.tanggal}</span>
                </div>
                <p class="text-xs text-slate-700 mt-1"><strong>Isi Aduan:</strong> ${activeAduan.isi}</p>

              </div>

                  return `
                    <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                      <div class="max-w-[80%] px-4 py-2.5 rounded-2xl text-xs shadow-sm ${isMe ? 'bg-theme text-white rounded-br-none' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-none'}">
                        <p class="font-bold text-[10px] opacity-80 mb-0.5">${c.senderName} • ${c.waktu}</p>
                        <p class="leading-relaxed">${c.pesan}</p>

                    </div>
                  `;
                }).join('')}
              </div>

              <form onsubmit="sendAduanChat(event, '${activeAduan.id}', 'pengawas', '${currentUser.nama}')" class="p-3 border-t border-slate-200 flex gap-2 bg-white rounded-b-2xl">
                <input type="text" id="chat-input-pgw" required placeholder="Tulis balasan tindak lanjut untuk Kepala Madrasah..." class="flex-1 px-4 py-2.5 rounded-xl border border-slate-300 text-xs outline-none focus:border-theme" />
                <button type="submit" class="px-5 py-2.5 bg-theme hover:bg-theme-dark text-white font-bold rounded-xl text-xs flex items-center gap-1.5">
                  <i data-lucide="send" class="w-4 h-4"></i> Kirim
                </button>
              </form>
            ` : `<div class="flex-1 flex items-center justify-center text-slate-400 text-sm">Pilih pengaduan untuk membuka ruang diskusi.</div>`}
          </div>
        </div>
      `;
    }

    function sendAduanChat(e, aduanId, role, senderName) {
      e.preventDefault();
      const inputId = role === 'pengawas' ? 'chat-input-pgw' : 'chat-input-km';
      const msg = document.getElementById(inputId).value.trim();
      const aduan = db.pengaduanList.find(a => a.id === aduanId);
      if (aduan && msg) {
        aduan.chat.push({
          senderRole: role,
          senderName,
          waktu: new Date().toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }),
          pesan: msg
        });
        saveState();
        render();
      }
    }

    function navKepala(menu, sub = '') {
      session.activeMenu = menu;
      session.activeSubMenu = sub;
      render();

    function openKepalaAccountModal(userId) {
      const u = db.kepalaUsers.find(x => x.id === userId);
      if (!u) return;
      openModal('Edit Profil Akun Kepala Madrasah', `
        <form onsubmit="saveKepalaAccount(event, '${u.id}')" class="space-y-3 text-sm">

            <div>

              <input type="date" id="km-acc-tmt" value="${u.tmt}" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300" />

              <label class="block text-xs font-bold text-slate-700 mb-1">Username</label>

      `, 'max-w-md');

    function handleKepalaPhoto(e, userId) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const u = db.kepalaUsers.find(x => x.id === userId);
        if (u) u.foto = ev.target.result;
        saveState();
        openKepalaAccountModal(userId);
      };
      reader.readAsDataURL(file);
    }

    function saveKepalaAccount(e, userId) {
      e.preventDefault();
      const u = db.kepalaUsers.find(x => x.id === userId);
      if (!u) return;
      u.nama = document.getElementById('km-acc-nama').value;
      u.nip = document.getElementById('km-acc-nip').value;
      u.tmt = document.getElementById('km-acc-tmt').value;
      u.username = document.getElementById('km-acc-user').value;
      u.password = document.getElementById('km-acc-pass').value;
      saveState();
      closeModal();
      showToast('Akun Kepala Madrasah berhasil diperbarui!', 'success');
      render();
    }

    function renderKepalaContent(currentUser) {
      switch (session.activeMenu) {
        case 'beranda': return renderKepalaBeranda(currentUser);
        case 'pendampingan': return renderKepalaPendampingan(currentUser);
        case 'pemantauan': return renderKepalaPemantauan(currentUser);
        case 'referensi': return renderKepalaReferensi(currentUser);
        case 'jadwal': return renderKepalaJadwal(currentUser);
        case 'pengaduan': return renderKepalaPengaduan(currentUser);
        default: return renderKepalaBeranda(currentUser);
      }
    }

            <button onclick="navKepala('beranda', 'prestasi_siswa')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold ${sub === 'prestasi_siswa' ? 'bg-theme text-white shadow' : 'text-slate-600 hover:bg-slate-100'}">

        bulan: document.getElementById('pres-bulan').value,
        namaPeserta: document.getElementById('pres-nama').value,
        jenisLomba: document.getElementById('pres-lomba').value,
        peringkat: document.getElementById('pres-peringkat').value,

      showToast('Prestasi siswa ditambahkan & terkirim ke Profil Pengawas!', 'success');

      db.prestasiList = db.prestasiList.filter(p => p.id !== id);

                          <td class="p-3 border">${m.strategi}</td>

                <form onsubmit="submitKepalaPelComment(event, '${pel.id}', '${currentUser.nama}')" class="flex gap-2 pt-2">

    function submitKepalaPlanComment(e, planId, sender) {
      e.preventDefault();
      const plan = db.perencanaanPendampingan.find(p => p.id === planId);
      const val = document.getElementById('km-plan-comment').value.trim();
      if (plan && val) {
        plan.komentarKepala.push({
          id: 'kom-' + Date.now(),
          pengirim: sender,
          waktu: new Date().toLocaleString('id-ID'),
          teks: val
        });
        saveState();
        showToast('Komentar terkirim ke akun Pengawas Madrasah!', 'success');
        render();
      }
    }

    function submitKepalaPelComment(e, pelId, sender) {
      e.preventDefault();
      const pel = db.pelaksanaanProgram.find(p => p.id === pelId);
      const val = document.getElementById('km-pel-comment').value.trim();
      if (pel && val) {
        pel.komentarKepala.push({
          id: 'kpel-' + Date.now(),
          pengirim: sender,
          waktu: new Date().toLocaleString('id-ID'),
          teks: val
        });
        saveState();
        showToast('Komentar pelaksanaan program terkirim ke Pengawas!', 'success');
        render();
      }
    }

    // -------------------------------------------------------------------------
    // MENU 3 KEPALA: PEMANTAUAN (Instrumen, Rekap, Kinerja Visual)
    // -------------------------------------------------------------------------

      const myList = db.pemantauanList.filter(m => m.madrasahId === currentUser.madrasahId);

      return `
        <div class="space-y-6 animate-fade">
          <div class="bg-white p-2 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap gap-2">
            <button onclick="navKepala('pemantauan', 'instrumen')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold ${sub === 'instrumen' ? 'bg-theme text-white shadow' : 'text-slate-600 hover:bg-slate-100'}">
              Instrumen Pemantauan
            </button>
            <button onclick="navKepala('pemantauan', 'rekap')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold ${sub === 'rekap' ? 'bg-theme text-white shadow' : 'text-slate-600 hover:bg-slate-100'}">
              Rekap Instrumen
            </button>
            <button onclick="navKepala('pemantauan', 'kinerja')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold ${sub === 'kinerja' ? 'bg-theme text-white shadow' : 'text-slate-600 hover:bg-slate-100'}">
              Kinerja Pengisian Instrumen
            </button>
          </div>

          ${sub === 'instrumen' ? `
            <div class="space-y-4">
              ${myList.map(it => {
                const isLocked = new Date(it.batasPengisian) < new Date();
                return `
                  <div class="bg-white rounded-2xl shadow-sm border ${isLocked ? 'border-rose-200 bg-rose-50/20' : 'border-slate-200'} p-5 space-y-4">
                    <div class="flex flex-wrap items-start justify-between gap-3">
                      <div>
                        <div class="flex items-center gap-2 flex-wrap">
                          <h4 class="font-extrabold text-slate-900 text-base">${it.namaInstrumen}</h4>
                          <span class="px-2.5 py-0.5 rounded-full text-xs font-extrabold ${isLocked ? 'bg-rose-100 text-rose-800' : 'bg-emerald-100 text-emerald-800'}">
                            ${isLocked ? '🔒 Terkunci' : '● Aktif'}
                          </span>
                        </div>
                        <p class="text-xs text-slate-500 mt-1">Batas Pengisian: <strong>${it.batasPengisian.replace('T', ' ')}</strong></p>
                      </div>

                      <div class="flex flex-wrap items-center gap-2">
                        ${!isLocked ? `
                          <a href="${it.linkInstrumen}" target="_blank" class="px-3.5 py-2 bg-theme text-white text-xs font-bold rounded-xl flex items-center gap-1.5 hover:bg-theme-dark">
                            <i data-lucide="external-link" class="w-4 h-4"></i> Lihat / Isi Instrumen
                          </a>
                          <button onclick="copyLinkInstrumen('${it.linkInstrumen}')" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold rounded-xl flex items-center gap-1.5">
                            <i data-lucide="copy" class="w-4 h-4"></i> Salin Link
                          </button>
                        ` : `
                          <button onclick="requestTimeExtension('${it.id}')" class="px-3.5 py-2 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold rounded-xl flex items-center gap-1.5">
                            <i data-lucide="clock" class="w-4 h-4"></i> ${it.mintaPerpanjangan ? 'Permohonan Terkirim' : 'Permohonan Penambahan Waktu'}
                          </button>
                        `}
                        ${it.linkHasil ? `
                          <a href="${it.linkHasil}" target="_blank" class="px-3.5 py-2 bg-sky-50 text-sky-700 border border-sky-200 text-xs font-bold rounded-xl flex items-center gap-1.5">
                            <i data-lucide="file-check" class="w-4 h-4"></i> Lihat Hasil
                          </a>
                        ` : ''}
                      </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 items-center pt-3 border-t border-slate-100 text-xs">
                      <div class="sm:col-span-4">
                        <label class="block font-bold text-slate-600 mb-1">Jumlah Partisipan (Input Manual)</label>
                        <input type="number" min="0" value="${it.jumlahPartisipan}" id="part-${it.id}" class="w-full px-3 py-2 rounded-xl border border-slate-300" />
                      </div>
                      <div class="sm:col-span-4 pt-4">
                        <label class="inline-flex items-center gap-2 font-bold text-slate-800 cursor-pointer bg-slate-50 px-3.5 py-2 rounded-xl border border-slate-200">
                          <input type="checkbox" id="tl-${it.id}" ${it.ditindaklanjuti ? 'checked' : ''} class="accent-emerald-700 w-4 h-4" />
                          <span>Status: Ditindaklanjuti</span>
                        </label>
                      </div>
                      <div class="sm:col-span-4 flex justify-end pt-4">
                        <button onclick="submitInstrumenStatusKepala('${it.id}')" class="px-5 py-2.5 bg-slate-900 hover:bg-black text-white font-bold rounded-xl flex items-center gap-1.5">

    function copyLinkInstrumen(link) {
      navigator.clipboard?.writeText(link);
      showToast('Link instrumen berhasil disalin ke clipboard!', 'success');
    }

    function requestTimeExtension(id) {
      const it = db.pemantauanList.find(x => x.id === id);
      if (it) {
        it.mintaPerpanjangan = true;
        saveState();
        showToast('Permohonan penambahan waktu pengisian berhasil dikirim ke Pengawas Madrasah!', 'success');
        render();
      }
    }

    function submitInstrumenStatusKepala(id) {
      const it = db.pemantauanList.find(x => x.id === id);
      if (!it) return;
      it.jumlahPartisipan = Number(document.getElementById(`part-${id}`).value || 0);
      it.ditindaklanjuti = document.getElementById(`tl-${id}`).checked;
      saveState();
      showToast('Laporan tindak lanjut & jumlah partisipan diteruskan ke Pengawas!', 'success');
      render();
    }

    function renderKepalaRekapInstrumen(myList) {
      const filtered = myList.filter(it => {
        const isLocked = new Date(it.batasPengisian) < new Date();
        if (session.filterStatusInstrumen === 'Aktif') return !isLocked;
        if (session.filterStatusInstrumen === 'Terkunci') return isLocked;
        return true;
      });

      return `
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <h3 class="font-extrabold text-slate-800">Rekap Instrumen & Hasil Validasi Pengawas</h3>
            <select onchange="session.filterStatusInstrumen=this.value; render();" class="px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-bold bg-white">
              <option value="Semua">Filter Status: Semua</option>
              <option value="Aktif" ${session.filterStatusInstrumen === 'Aktif' ? 'selected' : ''}>Aktif</option>
              <option value="Terkunci" ${session.filterStatusInstrumen === 'Terkunci' ? 'selected' : ''}>Terkunci</option>
            </select>
          </div>
          <div class="overflow-x-auto border border-slate-200 rounded-xl">
            <table class="w-full text-xs text-left">
              <thead class="bg-theme text-white">
                <tr>
                  <th class="p-3">Nama Instrumen</th>
                  <th class="p-3">Status Akses</th>
                  <th class="p-3">Status Validasi Pengawas</th>
                  <th class="p-3">Hasil Penilaian (Reward)</th>
                  <th class="p-3">Aksi</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200">
                ${filtered.map(it => {
                  const isLocked = new Date(it.batasPengisian) < new Date();
                  return `
                    <tr>
                      <td class="p-3 font-bold text-slate-900">${it.namaInstrumen}</td>
                      <td class="p-3">
                        <span class="px-2 py-0.5 rounded font-bold ${isLocked ? 'bg-rose-100 text-rose-800' : 'bg-emerald-100 text-emerald-800'}">
                          ${isLocked ? 'Terkunci' : 'Aktif'}
                        </span>
                      </td>
                      <td class="p-3 font-bold text-sky-800">${it.statusValidasi}</td>
                      <td class="p-3">
                        <div class="flex items-center gap-0.5">
                          ${[1, 2, 3, 4, 5].map(s => `<i data-lucide="star" class="w-4 h-4 ${s <= it.rating ? 'fill-amber-400 text-amber-400' : 'text-slate-300'}"></i>`).join('')}
                        </div>
                      </td>
                      <td class="p-3">
                        <a href="${it.linkInstrumen}" target="_blank" class="text-theme font-bold hover:underline flex items-center gap-1">
                          <i data-lucide="edit" class="w-3.5 h-3.5"></i> Isi Instrumen
                        </a>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderKepalaKinerjaInstrumen(myList) {
      const total = myList.length;
      const done = myList.filter(x => x.ditindaklanjuti).length;
      const undone = total - done;
      const isGood = done >= undone && total > 0;

      const cDiterima = myList.filter(x => x.statusValidasi === 'Hasil Diterima').length;
      const cTinjau = myList.filter(x => x.statusValidasi === 'Proses Peninjauan').length;
      const cSelesai = myList.filter(x => x.statusValidasi === 'Selesai').length;

      const pctDiterima = total ? Math.round((cDiterima / total) * 100) : 0;
      const pctTinjau = total ? Math.round((cTinjau / total) * 100) : 0;
      const pctSelesai = total ? Math.max(0, 100 - pctDiterima - pctTinjau) : 0;

      const deg1 = pctDiterima * 3.6;
      const deg2 = (pctDiterima + pctTinjau) * 3.6;

      return `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- Horizontal Bar Chart + Conclusion -->
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-5">
            <h3 class="font-extrabold text-slate-800">Diagram Batang Horizontal Kinerja Pengisian</h3>
            <div class="space-y-4 text-xs font-bold">
              <div>
                <div class="flex justify-between mb-1"><span>Total Jumlah Instrumen</span><span>${total} (100%)</span></div>
                <div class="w-full h-5 bg-slate-100 rounded-full overflow-hidden">
                  <div class="h-full bg-sky-600 rounded-full" style="width: ${total ? 100 : 0}%"></div>
                </div>
              </div>
              <div>
                <div class="flex justify-between mb-1 text-emerald-800"><span>Instrumen Ditindaklanjuti</span><span>${done} (${total ? Math.round((done / total) * 100) : 0}%)</span></div>
                <div class="w-full h-5 bg-slate-100 rounded-full overflow-hidden">
                  <div class="h-full bg-emerald-600 rounded-full" style="width: ${total ? (done / total) * 100 : 0}%"></div>
                </div>
              </div>
              <div>
                <div class="flex justify-between mb-1 text-rose-700"><span>Instrumen Belum Ditindaklanjuti</span><span>${undone} (${total ? Math.round((undone / total) * 100) : 0}%)</span></div>
                <div class="w-full h-5 bg-slate-100 rounded-full overflow-hidden">
                  <div class="h-full bg-rose-500 rounded-full" style="width: ${total ? (undone / total) * 100 : 0}%"></div>
                </div>
              </div>
            </div>

            <!-- Kesimpulan Otomatis (Jempol vs Semangat) -->
            <div class="p-4 rounded-2xl border ${isGood ? 'bg-emerald-50 border-emerald-200 text-emerald-950' : 'bg-amber-50 border-amber-200 text-amber-950'} flex items-center gap-4">
              <div class="text-4xl">${isGood ? '👍' : '💪'}</div>
              <div>
                <p class="font-extrabold text-sm">${isGood ? 'Kinerja Sangat Baik! Pertahankan!' : 'Tetap Semangat Meningkatkan Tindak Lanjut!'}</p>
                <p class="text-xs opacity-85 mt-0.5">
                  ${isGood
                    ? 'Jumlah instrumen yang telah ditindaklanjuti lebih banyak dibandingkan yang belum ditindaklanjuti.'
                    : 'Masih terdapat instrumen yang perlu segera ditindaklanjuti bersama tim pengembang madrasah.'}
                </p>
              </div>
            </div>
          </div>

          <!-- Pie / Donut Chart Status Validasi -->
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between">
            <h3 class="font-extrabold text-slate-800 mb-4">Diagram Lingkaran Status Validasi Pengawas</h3>
            <div class="flex flex-col sm:flex-row items-center justify-center gap-8 my-auto">
              <div class="w-44 h-44 rounded-full relative flex items-center justify-center shadow-inner"
                style="background: conic-gradient(#0284c7 0deg ${deg1}deg, #f59e0b ${deg1}deg ${deg2}deg, #059669 ${deg2}deg 360deg);">
                <div class="w-24 h-24 bg-white rounded-full flex flex-col items-center justify-center shadow">
                  <span class="text-xs text-slate-400 font-bold">Total</span>
                  <span class="text-xl font-extrabold text-slate-800">${total}</span>
                </div>
              </div>
              <div class="space-y-2.5 text-xs font-bold">
                <div class="flex items-center gap-2">
                  <span class="w-3.5 h-3.5 rounded-sm bg-sky-600"></span>
                  <span>Hasil Diterima: ${cDiterima} (${pctDiterima}%)</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="w-3.5 h-3.5 rounded-sm bg-amber-500"></span>
                  <span>Proses Peninjauan: ${cTinjau} (${pctTinjau}%)</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="w-3.5 h-3.5 rounded-sm bg-emerald-600"></span>
                  <span>Selesai: ${cSelesai} (${pctSelesai}%)</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

      render();

    function submitPermohonanPendampingan(e, madId, namaMad, namaKm) {
      e.preventDefault();
      db.permohonanPendampingan.unshift({
        id: 'ppend-' + Date.now(),
        madrasahId: madId,
        namaMadrasah: namaMad,
        kepalaMadrasah: namaKm,
        tanggal: document.getElementById('ppend-tgl').value,
        judul: document.getElementById('ppend-judul').value.trim(),
        status: 'Terkirim'
      });
      saveState();
      showToast('Permohonan pendampingan diteruskan ke Pengawas Madrasah!', 'success');
      render();
    }

    // -------------------------------------------------------------------------
    // MENU 6 KEPALA: PENGADUAN (Isi Aduan / Draft & Lihat Tindak Lanjut Chat)
    // -------------------------------------------------------------------------
    function renderKepalaPengaduan(currentUser) {
      const sub = session.activeSubMenu || 'isi_aduan';
      const myAduan = db.pengaduanList.filter(a => a.madrasahId === currentUser.madrasahId);

      return `
        <div class="space-y-6 animate-fade">
          <div class="bg-white p-2 rounded-2xl shadow-sm border border-slate-200 flex gap-2">
            <button onclick="navKepala('pengaduan', 'isi_aduan')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold ${sub === 'isi_aduan' ? 'bg-theme text-white shadow' : 'text-slate-600 hover:bg-slate-100'}">
              Isi Aduan
            </button>
            <button onclick="navKepala('pengaduan', 'lihat_tindak_lanjut')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold ${sub === 'lihat_tindak_lanjut' ? 'bg-theme text-white shadow' : 'text-slate-600 hover:bg-slate-100'}">
              Lihat Tindak Lanjut (Chat Pengawas)
            </button>
          </div>

          ${sub === 'isi_aduan' ? `
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 max-w-2xl space-y-4">
              <h3 class="font-extrabold text-slate-800">Formulir Pengaduan & Konsultasi Madrasah</h3>
              <form onsubmit="submitKepalaAduan(event, '${currentUser.madrasahId}', '${currentUser.namaMadrasah}', '${currentUser.nama}', 'Terkirim')" class="space-y-3 text-xs">
                <div>
                  <label class="block font-bold text-slate-700 mb-1">Hari / Tanggal</label>
                  <input type="date" id="adu-tgl" value="${new Date().toISOString().slice(0, 10)}" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300" />
                </div>
                <div>
                  <label class="block font-bold text-slate-700 mb-1">Isi Aduan / Permasalahan *</label>
                  <textarea id="adu-isi" rows="3" required placeholder="Jelaskan kendala atau permasalahan yang dihadapi madrasah..." class="w-full p-3.5 rounded-xl border border-slate-300"></textarea>
                </div>
                <div>
                  <label class="block font-bold text-slate-700 mb-1">Harapan / Solusi yang Diharapkan *</label>
                  <textarea id="adu-harapan" rows="2" required placeholder="Tuliskan harapan tindak lanjut..." class="w-full p-3.5 rounded-xl border border-slate-300"></textarea>
                </div>
                <div class="flex gap-2 pt-2">
                  <button type="button" onclick="saveAduanDraft('${currentUser.madrasahId}', '${currentUser.namaMadrasah}', '${currentUser.nama}')" class="px-4 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold rounded-xl">
                    Simpan ke Draft
                  </button>
                  <button type="submit" class="px-5 py-2.5 bg-theme hover:bg-theme-dark text-white font-bold rounded-xl shadow flex items-center gap-1.5">
                    <i data-lucide="send" class="w-4 h-4"></i> Kirim ke Pengawas Bina
                  </button>
                </div>
              </form>
            </div>
          ` : `
            <div class="space-y-4">
              ${myAduan.map(a => `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-4">
                  <div class="flex justify-between items-start border-b border-slate-100 pb-3">
                    <div>
                      <span class="px-2 py-0.5 rounded text-[10px] font-bold ${a.status === 'Draft' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}">${a.status}</span>
                      <p class="text-xs font-bold text-slate-900 mt-1">${a.isi}</p>
                      <p class="text-[11px] text-slate-500">Harapan: ${a.harapan} • Tanggal: ${a.tanggal}</p>
                    </div>
                    ${a.status === 'Draft' ? `
                      <button onclick="sendDraftAduan('${a.id}')" class="px-3 py-1.5 bg-theme text-white text-xs font-bold rounded-xl">Kirim Sekarang</button>
                    ` : ''}
                  </div>

                  <!-- Chat Room -->
                  <div class="bg-slate-50 rounded-xl p-4 space-y-2.5 max-h-64 overflow-y-auto">
                    ${(a.chat || []).map(c => {
                      const isMe = c.senderRole === 'kepala';
                      return `
                        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                          <div class="max-w-[80%] px-3.5 py-2 rounded-2xl text-xs ${isMe ? 'bg-theme text-white' : 'bg-white border border-slate-200 text-slate-800'}">
                            <p class="font-bold text-[10px] opacity-80">${c.senderName} • ${c.waktu}</p>
                            <p class="mt-0.5">${c.pesan}</p>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>

                  <form onsubmit="sendAduanChat(event, '${a.id}', 'kepala', '${currentUser.nama}')" class="flex gap-2">
                    <input type="text" id="chat-input-km" required placeholder="Balas pesan tindak lanjut Pengawas Bina..." class="flex-1 px-3.5 py-2 rounded-xl border border-slate-300 text-xs" />
                    <button type="submit" class="px-4 py-2 bg-theme text-white font-bold rounded-xl text-xs">Kirim</button>
                  </form>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    function submitKepalaAduan(e, madId, namaMad, namaKm, status = 'Terkirim') {
      if (e) e.preventDefault();
      const tgl = document.getElementById('adu-tgl').value;
      const isi = document.getElementById('adu-isi').value.trim();
      const harapan = document.getElementById('adu-harapan').value.trim();
      if (!isi) return showToast('Isi aduan tidak boleh kosong!', 'error');

      db.pengaduanList.unshift({
        id: 'adu-' + Date.now(),
        madrasahId: madId,
        namaMadrasah: namaMad,
        kepalaMadrasah: namaKm,
        tanggal: tgl,
        isi,
        harapan,
        status,
        chat: [{
          senderRole: 'kepala',
          senderName: namaKm,
          waktu: new Date().toLocaleString('id-ID'),
          pesan: isi
        }]
      });
      saveState();
      showToast(status === 'Draft' ? 'Aduan disimpan ke Draft!' : 'Aduan terkirim ke Pengawas Madrasah!', 'success');
      navKepala('pengaduan', 'lihat_tindak_lanjut');
    }

    function saveAduanDraft(madId, namaMad, namaKm) {
      submitKepalaAduan(null, madId, namaMad, namaKm, 'Draft');
    }

    function sendDraftAduan(id) {
      const a = db.pengaduanList.find(x => x.id === id);
      if (a) {
        a.status = 'Terkirim';
        saveState();
        showToast('Draft aduan berhasil dikirim ke Pengawas!', 'success');
        render();
      }
    }

    // Initialize Application on Load
    window.onload = function () {
      render();
    };
  </script>
</body>
</html>
